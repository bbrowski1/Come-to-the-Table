<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Filter for subtle depth -->
    <filter id="badge-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Main Tan/Linen Circular Badge -->
  <circle cx="256" cy="256" r="204" fill="#D7CEBF" filter="url(#badge-shadow)" />

  <!-- Inner Fine Dark Ring -->
  <circle cx="256" cy="256" r="192" fill="none" stroke="#1F1A18" stroke-width="1.6" />

  <!-- Group for Typography -->
  <g fill="#1B1716" font-family="'Helvetica Neue', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <!-- COME TO -->
    <text x="256" y="152" text-anchor="middle" font-size="37" font-weight="800" letter-spacing="4">COME TO</text>

    <!-- THE -->
    <text x="162" y="246" text-anchor="middle" font-size="37" font-weight="800" letter-spacing="3">THE</text>

    <!-- ABLE -->
    <text x="348" y="246" text-anchor="middle" font-size="37" font-weight="800" letter-spacing="7">ABLE</text>
  </g>

  <!-- Stylized Brush Stroke Cross (The 'T') -->
  <g fill="#151211">
    <!-- Vertical Mast with expressive dry-brush bristles -->
    <path d="M 252,168 
             C 253,172 251,180 252,192
             C 249,198 247,208 248,216
             L 246,228
             C 248,236 249,245 249,258
             C 248,270 250,282 251,296
             C 251,302 253,308 254,316
             C 255,313 256,305 257,298
             C 259,286 260,272 260,258
             C 261,244 262,232 260,226
             L 262,216
             C 261,206 261,194 259,182
             C 258,174 256,170 254,168 Z" />
    <!-- Bristle splatters vertical -->
    <path d="M 254,164 C 255,168 253,174 255,182 L 257,178 Z" opacity="0.8" />
    <path d="M 252,305 L 253,322 L 254,310 Z" opacity="0.75" />
    <path d="M 249,298 L 250,314 L 252,302 Z" opacity="0.7" />
    <path d="M 255,296 L 256,312 L 258,300 Z" opacity="0.6" />

    <!-- Horizontal Crossbar with brush stroke tapers -->
    <path d="M 206,220
             C 214,218 222,217 236,218
             C 248,217 262,217 278,218
             C 288,219 296,220 304,222
             C 298,225 288,226 276,225
             C 260,226 244,226 230,225
             C 220,226 212,225 206,220 Z" />
    <!-- Crossbar bristle details -->
    <path d="M 202,221 C 206,219 212,220 218,221 L 210,223 Z" opacity="0.7" />
    <path d="M 302,221 C 306,222 308,223 306,224 L 298,224 Z" opacity="0.8" />
    <path d="M 244,213 C 248,214 260,214 264,213 L 261,228 Z" opacity="0.4" />
  </g>

  <!-- Divider & Side by Side -->
  <g>
    <!-- Left line -->
    <line x1="98" y1="325" x2="154" y2="325" stroke="#1B1716" stroke-width="1.5" stroke-linecap="round" />
    <!-- Text -->
    <text x="256" y="330" text-anchor="middle" fill="#1B1716" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="4.5">SIDE BY SIDE</text>
    <!-- Right line -->
    <line x1="358" y1="325" x2="414" y2="325" stroke="#1B1716" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Scripture Reference -->
  <text x="256" y="354" text-anchor="middle" fill="#1B1716" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" letter-spacing="3.5">1 THESSALONIANS 5:11</text>

  <!-- Mini Red Shield at Bottom Center -->
  <g transform="translate(233, 368) scale(0.38)">
    <!-- Shield Outline -->
    <path d="M 60,6
             C 49,8 37,13 22,7
             C 14,4 8,12 8,24
             L 8,78
             C 8,102 33,124 60,138
             C 87,124 112,102 112,78
             L 112,24
             C 112,12 106,4 98,7
             C 83,13 71,8 60,6 Z"
          fill="#D3202A"
          stroke="#FFFFFF"
          stroke-width="3.5"
          stroke-linejoin="round" />
    
    <!-- Shield White Piping -->
    <path d="M 60,12
             C 50,14 39,19 25,13
             C 18,11 13,17 13,27
             L 13,76
             C 13,96 36,116 60,128
             C 84,116 107,96 107,76
             L 107,27
             C 107,17 102,11 95,13
             C 81,19 70,14 60,12 Z"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="1.6" />

    <!-- Text inside shield -->
    <g fill="#FFFFFF" font-family="'Helvetica Neue', Arial, sans-serif" text-anchor="middle">
      <text x="60" y="38" font-size="14" font-weight="bold" letter-spacing="1.5">THE</text>
      <text x="60" y="67" font-size="14" font-weight="900" letter-spacing="0.6">SALVATION</text>
      <path d="M 20,74 Q 60,78 100,74" stroke="#FFFFFF" stroke-width="2.2" fill="none" stroke-linecap="round" />
      <text x="60" y="98" font-size="18" font-weight="900" letter-spacing="1.2">ARMY</text>
    </g>
  </g>
</svg>