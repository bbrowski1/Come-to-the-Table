name: Build Android APK

on:
  push:
    branches: [ main, master ] # Triggers the build whenever you push to main/master
  workflow_dispatch: # Allows you to trigger the build manually

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter or React Native (Uncomment the one you used)
        # If your AI Studio app is Flutter, uncomment the line below:
        # uses: subosito/flutter-action@v2
        
        # If your AI Studio app is React Native, uncomment the line below:
        uses: actions/setup-node@v4

      - name: Build Debug APK
        run: |
          # Change this command depending on your app framework:
          # For native Android (Java/Kotlin): ./gradlew assembleDebug
          # For Flutter: flutter build apk --debug
          # For React Native: cd android && ./gradlew assembleDebug
          ./gradlew assembleDebug 

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk # Verify this path matches your framework

