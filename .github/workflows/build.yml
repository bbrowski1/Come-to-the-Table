name: Build Android APK via Capacitor

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Project Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build # Compiles your web assets (usually creates a 'dist' or 'build' folder)

      - name: Install and Initialize Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli
          # Initializes Capacitor. Using default web dir 'dist'. If your build output goes to 'build', change dist to build.
          npx cap init "Come to the Table" "com.bbrowski1.cometothetable" --web-dir=dist --noprompt
          
      - name: Add Android Platform
        run: |
          npm install @capacitor/android
          npx cap add android
          npx cap sync android

      - name: Build Debug APK via Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: table-app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
